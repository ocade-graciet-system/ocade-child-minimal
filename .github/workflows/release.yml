name: Build and Release Theme

on:
  push:
    branches:
      - master

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.run_number > 1 && !contains(github.event.head_commit.message, 'NORUN') # Workflow s'exécute uniquement si pas le premier commit et qu'il n'y a pas NORUN dans le message du commit.

    steps:
      - uses: actions/checkout@v2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v2
        with:
          node-version: '16.x'
          registry-url: 'https://npm.pkg.github.com'
      - name: Install dependencies
        run: npm install
      - name: Build production assets
        run: npm run production
      - name: Git config
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git config --global pull.rebase true
          git add .
          git commit . -m "[bot] Updated Styles For Production" || true
      - name: Increment action step
        id: increment
        uses: ocade-graciet-system/action-wp-metadata@v1
        with:
          indexFile: 'style.css' # Entrée du plugin(~fichier.php pour plugin) ou style.css(thème)
      - name: Commit new comment version
        run: |
          git commit style.css -m "[bot] Updated library version"
      - name: Push new version to master branch
        uses: ocade-graciet-system/action-push-master@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: master
      - name: Créer l'archive .zip avec un dossier racine au nom du paquet
        run: |
          # Le zip DOIT contenir un dossier racine au nom du paquet : sans lui, WordPress 7.1.4+ installe
          # la mise à jour dans un dossier au nom aléatoire (ex. <paquet>-O2QfDfqGGQmh7GkU) et désactive le plugin.
          PKG_NAME="${{ github.event.repository.name }}"
          mkdir -p "$RUNNER_TEMP/pkg/$PKG_NAME"
          for item in ./*; do
            if [ -e "$item" ]; then cp -a "$item" "$RUNNER_TEMP/pkg/$PKG_NAME/"; fi
          done
          (cd "$RUNNER_TEMP/pkg" && zip --symlinks -rq "$GITHUB_WORKSPACE/**NOM_DEPOT_GITHUB**.zip" "$PKG_NAME")
          unzip -l "**NOM_DEPOT_GITHUB**.zip" | head -15
          test -n "$(ls -A "$RUNNER_TEMP/pkg/$PKG_NAME")"
      - name: Publish release
        uses: "ocade-graciet-system/action-releases@v1"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "${{ steps.increment.outputs.version }}"
          prerelease: true
          title: "${{ steps.increment.outputs.version }}"
          files: |
            **NOM_DEPOT_GITHUB**.zip
            ./metadata.json
